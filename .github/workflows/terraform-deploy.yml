name: Terraform deployment

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Select the Terraform root to plan or deploy"
        required: true
        type: choice
        options:
          - application
          - backup-infra
        default: application
      mode:
        description: "Plan only, or request an apply"
        required: true
        type: choice
        options:
          - plan
          - deploy
        default: plan
      confirm:
        description: "For deploy mode only, type DEPLOY. Otherwise no apply job will run."
        required: true
        type: string
        default: "NO"
      allowed_client_ipv4_cidr:
        description: "Optional override for target=application. Use your current public IPv4 address followed by /32; blank uses ALB_ALLOWED_CLIENT_CIDR."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: uptimekuma-terraform-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  plan:
    name: Create Terraform plan
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_ROOT: ${{ inputs.target == 'backup-infra' && 'terraform/backup-infra' || 'terraform' }}
    steps:
      - name: Checkout the selected main-branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false

      - name: Configure short-lived AWS credentials (plan role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          # Configure AWS_ACCOUNT_ID as a repository variable; no AWS account ID is embedded here.
          role-session-name: gha-terraform-plan-${{ github.run_id }}
          aws-region: eu-west-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Initialize selected Terraform backend
        run: terraform -chdir="$TF_ROOT" init -input=false -lockfile=readonly

      - name: Create saved plan
        env:
          TF_VAR_alert_email: ${{ inputs.target == 'application' && vars.ALERT_EMAIL || '' }}
          TF_VAR_allowed_client_ipv4_cidr: ${{ inputs.target == 'application' && (inputs.allowed_client_ipv4_cidr || vars.ALB_ALLOWED_CLIENT_CIDR) || '' }}
        run: terraform -chdir="$TF_ROOT" plan -input=false -no-color -out="$RUNNER_TEMP/tfplan"

      - name: Write plan review and summary
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="$TF_ROOT" show -no-color "$RUNNER_TEMP/tfplan" > "$RUNNER_TEMP/tfplan-review.txt"
          {
            echo "## Terraform plan"
            echo
            grep -E '^Plan:|^No changes\.' "$RUNNER_TEMP/tfplan-review.txt" || true
            echo
            echo "The full plan is encrypted in the one-day artifact. Download and decrypt it locally for review before approving any apply."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Encrypt the plan artifact
        shell: bash
        env:
          TFPLAN_ENCRYPTION_KEY: ${{ secrets.TFPLAN_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${TFPLAN_ENCRYPTION_KEY:-}" ]]; then
            echo "::error::Add the TFPLAN_ENCRYPTION_KEY repository secret before running this workflow."
            exit 1
          fi
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/tfplan-bundle.tar.gz" tfplan tfplan-review.txt
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 \
            -pass env:TFPLAN_ENCRYPTION_KEY \
            -in "$RUNNER_TEMP/tfplan-bundle.tar.gz" \
            -out "$RUNNER_TEMP/tfplan-bundle.tar.gz.enc"
          rm -f "$RUNNER_TEMP/tfplan" "$RUNNER_TEMP/tfplan-review.txt" "$RUNNER_TEMP/tfplan-bundle.tar.gz"

      - name: Upload encrypted plan for this workflow run only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terraform-plan-encrypted
          path: ${{ runner.temp }}/tfplan-bundle.tar.gz.enc
          if-no-files-found: error
          retention-days: 1

  apply:
    name: Apply the reviewed saved plan
    needs: plan
    if: ${{ github.ref == 'refs/heads/main' && inputs.mode == 'deploy' && inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    environment:
      name: aws-deploy
    permissions:
      contents: read
      id-token: write
    env:
      TF_ROOT: ${{ inputs.target == 'backup-infra' && 'terraform/backup-infra' || 'terraform' }}
      TFPLAN_ENCRYPTION_KEY: ${{ secrets.TFPLAN_ENCRYPTION_KEY }}
    steps:
      - name: Checkout the same commit used for planning
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up the same Terraform version
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false

      - name: Download the encrypted plan from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: terraform-plan-encrypted
          path: ${{ runner.temp }}/tfplan-artifact

      - name: Decrypt the saved plan
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TFPLAN_ENCRYPTION_KEY:-}" ]]; then
            echo "::error::TFPLAN_ENCRYPTION_KEY is missing."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -pass env:TFPLAN_ENCRYPTION_KEY \
            -in "$RUNNER_TEMP/tfplan-artifact/tfplan-bundle.tar.gz.enc" \
            -out "$RUNNER_TEMP/tfplan-bundle.tar.gz"
          tar -xzf "$RUNNER_TEMP/tfplan-bundle.tar.gz" -C "$RUNNER_TEMP"
          test -s "$RUNNER_TEMP/tfplan"
          rm -f "$RUNNER_TEMP/tfplan-artifact/tfplan-bundle.tar.gz.enc" "$RUNNER_TEMP/tfplan-bundle.tar.gz"

      - name: Configure short-lived AWS credentials (apply role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          # Configure AWS_ACCOUNT_ID as a repository variable; no AWS account ID is embedded here.
          role-session-name: gha-terraform-apply-${{ github.run_id }}
          aws-region: eu-west-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Initialize selected Terraform backend
        run: terraform -chdir="$TF_ROOT" init -input=false -lockfile=readonly

      - name: Apply only the saved plan produced earlier in this run
        run: terraform -chdir="$TF_ROOT" apply -input=false "$RUNNER_TEMP/tfplan"
